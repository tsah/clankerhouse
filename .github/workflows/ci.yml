name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y python3 jq zoxide util-linux
      - name: Install Herdr
        env:
          # Must speak the protocol pinned by HERDR_PROTOCOL in src/multiplexer/herdr.ts.
          HERDR_VERSION: "0.9.3"
          HERDR_SHA256: 18a8dc65f1c2fa485884344356dea1cfd911c6f06cf46fa78e193f4087f4dba7
        run: |
          curl -fsSL -o "$RUNNER_TEMP/herdr" "https://github.com/herdrdev/herdr/releases/download/v$HERDR_VERSION/herdr-linux-x86_64"
          echo "$HERDR_SHA256  $RUNNER_TEMP/herdr" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/herdr" /usr/local/bin/herdr
          herdr --version
      - name: Install Worktrunk
        env:
          WORKTRUNK_VERSION: "0.79.0"
          WORKTRUNK_SHA256: b8c190b1d652370ef9f6b8f4694a2d6831b5b22f4b789f047612aad32764c6cf
        run: |
          archive=worktrunk-x86_64-unknown-linux-musl.tar.xz
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/max-sixty/worktrunk/releases/download/v$WORKTRUNK_VERSION/$archive"
          echo "$WORKTRUNK_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/worktrunk-x86_64-unknown-linux-musl/wt" /usr/local/bin/wt
          wt --version
      - name: Install Neovim
        env:
          NEOVIM_VERSION: "0.12.5"
          NEOVIM_SHA256: bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875
        run: |
          archive=nvim-linux-x86_64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/neovim/neovim/releases/download/v$NEOVIM_VERSION/$archive"
          echo "$NEOVIM_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/$archive" -C /opt
          sudo ln -s /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
          nvim --version | head -n 1
      - run: bun install --frozen-lockfile
      - run: ./test --unit
      - run: bun run qa:native-hot
      - run: scripts/qa-clanker-api
      - run: scripts/qa-orchestration
      - run: scripts/qa-daemon
      - run: scripts/qa-herdr
      - run: bash -x scripts/qa-install

  # Herdr stays the default; this proves the hc lane against a pinned core. No user manager
  # here, so scripts/qa-hc covers the plain path and skips its systemd section.
  test-hc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y python3 jq zoxide util-linux
      - name: Install herdr-core
        env:
          HC_VERSION: "0.1.14"
          HC_SHA256: e9dbabdead0ce0ce3de51b6f54cc9549efedbb41b2f8448b6932ab0d1442343e
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hc.tar.gz" "https://releases.herdr.dev/core/$HC_VERSION/herdr-core-linux-x86_64.tar.gz"
          echo "$HC_SHA256  $RUNNER_TEMP/hc.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/hc.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/herdr-core" /usr/local/bin/herdr-core
          sudo ln -s herdr-core /usr/local/bin/hc
          hc --version
      - name: Install Worktrunk
        env:
          WORKTRUNK_VERSION: "0.79.0"
          WORKTRUNK_SHA256: b8c190b1d652370ef9f6b8f4694a2d6831b5b22f4b789f047612aad32764c6cf
        run: |
          archive=worktrunk-x86_64-unknown-linux-musl.tar.xz
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/max-sixty/worktrunk/releases/download/v$WORKTRUNK_VERSION/$archive"
          echo "$WORKTRUNK_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/worktrunk-x86_64-unknown-linux-musl/wt" /usr/local/bin/wt
      - run: bun install --frozen-lockfile
      - run: scripts/build-native
      - name: hc unit tests
        env:
          HC_REQUIRED: "1"
        run: bun test src/multiplexer
      - name: hc lane scenario
        env:
          HC_REQUIRED: "1"
        run: scripts/qa-hc
