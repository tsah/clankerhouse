name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: sudo apt-get update && sudo apt-get install -y tmux python3 jq zoxide util-linux
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run test:python
      - run: scripts/qa-clanker-api
      - run: scripts/qa-daemon
      - run: scripts/qa-recovery
      - run: scripts/qa-stop-popup
      - run: scripts/qa-install
