[package]
name = "clankerhouse-native"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
unicode-width = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
